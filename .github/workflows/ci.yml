name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, OXT package and LibreOffice smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-oxt.txt
      - name: Install pinned runtime and test dependencies
        run: python -m pip install -r requirements-oxt.txt pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
      - name: Build OXT
        run: python scripts/build_oxt.py
      - name: Build LibreOffice test image
        run: docker build -f scripts/Dockerfile.smoke -t assinafy-office-smoke .
      - name: Exercise the installed extension
        run: docker run --rm --init -v "$PWD:/workspace:ro" assinafy-office-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assinafy-oxt
          path: dist/*.oxt
          if-no-files-found: error
