[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "assinafy-libreoffice"
version = "1.0.0"
description = "Assinafy document signing for LibreOffice"
requires-python = ">=3.11"
dependencies = ["assinafy==1.6.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["pythonpath/assinafy_libreoffice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pythonpath"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
